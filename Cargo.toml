[package]
name = "bevy_carnage"
# **`0.5.62`: a shot that goes through goes through everything on its line** (`AG-135`). A shot
# through a forearm held across the chest went in and out of the forearm and stopped there. It now
# walks every crossing of the body it was sent at, counting itself in and out of each mesh by the
# winding of the triangles it crosses, and opens a wound at every way in and out; every cloth crossing
# is holed. A skin takes each droplet as its own stain, as a wall does. `capture_skinned --guard`.
#
# **`0.5.61`: a skinned crowd costs what a rigid one does** (`AG-134`). Every batch posed every
# skinned surface in the world to box it for the spray, and walked every pose's triangles. A skinned
# surface is now boxed by its joints without posing it, posed only when a ray reaches it, with the
# blend reused where the weights repeat, and cast at through its bind-pose hierarchy refitted to the
# pose. Forty skinned characters, twelve hits: 23.2 to 10.5 ms a tick. Every frame is unchanged.
#
# **`0.5.60`: a cast tests the triangles it can reach** (`AG-133`). The preset walked every triangle
# of a mesh for every ray. A rigid surface's mesh now carries a bounding-volume hierarchy, built the
# tick it is dressed and kept while the mesh is unchanged, and a cast through it lands exactly where
# the walk did, to the bit. One hit on a 16,128-triangle part 1.53 to 0.59 ms a tick, twelve on forty
# characters 12.1 to 9.3. Every frame of the skinned and tier clips is unchanged.
#
# **`0.5.59`: a shotgun on one character costs a third of what it did** (`AG-132`). The preset shades
# a skin's flaymap after every hit, and `FlayCanvas::shade` redrew the whole canvas each time: 2.3 ms
# of a twelve-pellet tick's 3.5. It now redraws the texels peeled since the last shade and the normals
# round them, to the same bytes; twelve hits on one character 3.69 to 1.29 ms a tick. Every frame of
# the skinned, tier-2, gore and flesh clips is unchanged.
#
# **`0.5.58`: a canvas ticks its blood, not the floor between** (`AG-131`). A wetmap ticked the one
# rectangle round all its blood and copied the whole canvas into its snapshot twice a tick: a pool in
# each of two corners of a 1024 floor cost 25.5 ms a tick. Each 32-texel tile now keeps the rectangle
# round its own blood, and the passes and the snapshot cover those grown by what a tick can reach:
# 0.46 ms, and one blob 0.34 to 0.23. Every digest holds.
#
# **`0.5.57`: a level's floor takes blood** (`AG-130`). A floor or a wall whose `UV_0` tiles its
# texture, as a level's does, clamped every drop to its canvas's edge. `Gore::projected()` dresses it
# on a copy of its mesh whose `UV_0` is the mesh seen square-on from the side it mostly faces, scaled
# into `[0, 1]`, and whose `UV_1` is the tiling it had, which its own textures now read; the density is
# the projection's. A mesh with a `UV_1` already is refused with a warning, and an unprojected floor
# whose UVs tile is warned about once. `capture_skinned --stroll` walks across 30 cm tiles.
#
# **`0.5.56`: a foot that steps in blood tracks it** (`AG-129`). `GoreStep` is the footstep a game
# raises for its sound; on the floor under it the sole lifts 30 % of the wet blood under its outline
# (`WetCanvas::lift_uv`, never dried blood) and prints what it carried (`WetCanvas::print_uv`), a
# boot's outline inked where it pressed and its tread holds blood, shedding 30 % a step so the prints
# fade. The load is a public `Tread` on the foot. `capture_skinned --stroll` walks the mannequin
# through a spill (`docs/skinned_stroll.gif`). The default skinned clip and tier 1 print the
# digests they did.
#
# **`0.5.55`: every bruise on a limb ages** (`AG-128`). `Bruising` held one bruise, so a second
# blow on the same mesh froze the first where it was. It now holds `sites`, one `BruiseSite` per
# blow up to `MAX_BRUISES` (8), the oldest retiring past that, and every one is stepped. The
# dermis canvas redraws them each model step over what it holds without them
# (`DermisCanvas::draw_bruises`), multiplying the ratios they lay over the skin, so two that overlap
# darken together: painted one over the other, they met at a pale seam. `capture_skinned --blows`
# shows two on one shin (`docs/skinned_bruises.gif`). Every digest holds.
#
# **`0.5.54`: the flesh material fits a scene with an environment map, on the web** (`AG-127`). The
# material sampled fifteen textures in its fragment stage, and a camera's `EnvironmentMapLight`
# adds two, past the sixteen WebGL2 and wgpu's default limits allow: its pipeline failed to build
# ("count was 17"). The subsurface and blood tables are now one image (`flesh::luts`), their
# bytes and `the_flesh_tables_are_frozen` unchanged. And the preset's clips are lit by a room: a
# procedural studio prefiltered on the CPU (`examples/common/studio.rs`) in place of a uniform
# ambient, so wet blood has something to reflect. Every digest holds.
#
# **`0.5.53`: a graze is raw** (`AG-126`). Round every flaymap crater the skin it only grazed was
# drawn bare, the dermis's pale pink mottled with the fat's cream, and read as a pale halo. A
# fresh abrasion is raw and moist from the first moment: the graze now wears `GRAZE_FILM` (4 %) of
# the cut film, ramped in over the skin's depth so its edge fades into the skin. Shader only;
# every digest holds; WebGL2 checked again.
#
# **`0.5.52`: a crater is lit through its mouth** (`AG-125`). The flesh material lit a flaymap crater
# as if it were open skin, so a wound pooled with blood was one red to its middle however deep it
# went. Each texel below the skin now finds the crater's walls in the flaymap's own depth, eight
# ways out to 15 texels, and every light term on it is multiplied by `1 − mean(sin h)`, the share of
# the room it sees between them. `FleshParams::cut.y` carries the layer span. Shader only; every
# digest holds; WebGL2 checked again.
#
# **`0.5.51`: a hit reads in the air, and follows the player's setting** (`AG-124`). The preset's
# wounds put blood on surfaces and nothing in the air at the moment of the hit; `CarnageVfxPlugin`
# turns every announced wound into a burst, but its mist was a few hard 1 cm dots flying at 40 m/s,
# gone in two frames, and it read no `GorePolicy`, so a game that turned blood off still sprayed it.
# The mist is now a soft puff that hangs at the wound, as Stokes has fine droplets do, three a spray
# droplet, in the colour of a film as thin as they are; a tier that draws no blood throws the same
# bursts in `substitute_srgb` (`CarnageEffects::substitute`, `Palette`). The preset's recorders and
# demos add the plugin under `vfx`.
#
# **`0.5.50`: a slash lies on the skin and opens into it** (`AG-123`). A slash's path was a straight
# line through the hit in the plane of the skin there, so across a curved limb its ends, and the
# wound bed built along it, stood off the skin: on the mannequin's thigh a pale plank across the leg.
# The path is now walked on the skin from the hit. And the bed's walls were lit as open skin, so a
# narrow cut read as a pale ridge; its vertex colour now carries the light that reaches it down the
# trough, `(1 + sin α)/2` at a lip and `sin² α` at the floor. The skinned clips' digests move with
# the torn mesh their blood runs over.
#
# **`0.5.49`: a slash's wound bed rides a skinned limb** (`AG-122`). The bed under a laceration is a
# mesh of its own, and on a skinned skin it had no joints and no `SkinnedMesh`, so it was drawn in
# the bind pose: once the limb moved, it stood off the body as a pale fin across the cut. Each bed
# vertex now takes the joints of the torn skin's vertex nearest it, the bed gets bounds when its skin
# has them, and the plugin spawns it with the skin's `SkinnedMesh` and its culling component.
#
# **`0.5.48`: a character can be healed** (`AG-121`). A game that respawned or pooled a dressed
# character had to despawn it and dress it again, every canvas and image rebuilt. `GoreReset` heals one
# in place: its canvases cleared and re-uploaded, its bleeding, bruises and soaks stopped, a slashed
# skin's own mesh put back and its wound bed removed, the bone handoff armed again. `WetCanvas::clear`,
# `FlayCanvas::clear`, `DermisCanvas::clear` and `ClothHoles::clear` are public. A reset run is the
# hitless run again, frame for frame and digest for digest.
#
# **`0.5.47`: blood has a surface** (`AG-120`). Every film of blood the flesh material drew was flat,
# one colour to its rim: a pool read as a red decal, and at a light's mirror angle it lit up whole as
# a white sticker. The film's own depth now lifts the shading normal, so a pool's edge curves down
# and catches the light, a run stands up off the skin, and the mirror breaks into a glint; blood in a
# crater lies level, cloth stays flat, and wet films are at roughness 0.3. Shader only; every digest
# holds; WebGL2 checked again.
#
# **`0.5.46`: the canvases tick in parallel** (`AG-119`). With forty characters dressed, the wetmaps'
# tick was the dearest system on every tick, hit or not: 2.8 ms on an M4 Pro with 49 bloody canvases.
# A canvas's tick reads and writes only itself, so `tick_canvases` now runs them across Bevy's compute
# pool: 0.86 ms, the bytes identical in any order. Single-threaded builds (the web) loop as before.
#
# **`0.5.45`: a shotgun in a crowd costs less** (`AG-118`). Twelve hits a tick on one of forty dressed
# characters spent most of `take_hits` drawing stains and casting droplets at surfaces they could not
# reach first. The spray now casts in the order its ray enters each surface's box and stops once a
# landing is nearer than the next box (239 casts a shot become 167), and `bloodstain::stain::rasterise`
# skips three kinds of work that cannot change a byte. Interleaved on an M4 Pro: 25–30 ms of
# `take_hits` become 15–16 ms. Every recorder's frames are byte-identical.
#
# **`0.5.44`: a bruise is a blotch** (`AG-117`). The preset painted the bruise model's colour as a
# disc of one tone with a hard rim — the model is a radial reduction whose pool is uniform inside its
# diameter, and its change was shown six times over — so a blow left a flat brown dot. Its outline now
# wanders by up to `BRUISE_WOBBLE` and its optical density is mottled by `BRUISE_MOTTLE` either way,
# both seeded by where it is, and it is shown exactly as dark as the model makes it. The model's
# colour is read once per shell rather than once per texel: 3.8 ms of spectral colour a repaint
# becomes 0.27 ms on a 256 canvas. Dermis only; every recorder digest holds.
#
# **`0.5.43`: a burn has zones** (`AG-116`). A contact burn was one colour per degree fading to its
# edge, so a third-degree iron burn read as a grey-brown smudge, the same as a bruise. It now shows
# Jackson's three zones as far in as its degree reached — a charred eschar, a pale ring of stasis, a
# red flare of hyperaemia past the contact (`preset::burn_zone`, `BURN_FLARE`) — round a margin that
# wanders off round by up to `BURN_WOBBLE`, seeded by where it was burnt. `DermisCanvas::paint_radial`'s
# painter takes the texel's direction as well. Dermis only; every recorder digest holds.
#
# **`0.5.42`: a crater is a wound, not a ring of fat** (`AG-115`). A flaymap crater showed the tissue it
# bared dry: a pink graze, a wide ring of yellow fat and a red centre, read as a fried egg. The flesh
# material's film of blood (`FleshParams::with_cut_film`) now lies over a canvas's peeled tissue as it
# does over a cut face, by depth, from nothing on the graze to its full `1 mm` in the muscle; the
# preset's skins wear it at `CUT_FACE_FILM_MM`. Shader only; every digest holds.
#
# **`0.5.41`: spilled guts look like bowel, not red tubing** (`AG-114`). Every strand was drawn in the
# red of the blood it lay in, so a heap of guts read as red plastic tubing in a red pool.
# `viscera::gut_image` is a texture for the tube's own `UV_0` — a salmon-pink serosa, the mesentery's
# fat along the tethered side, faint vessels round the wall, the wound end bloodied and smears dragged
# along the rest — and the preset's guts wear it at `viscera::GUT_ROUGHNESS`, one material for every
# spill where each spill used to make its own.
#
# **`0.5.40`: a run of blood leans the way gravity does** (`AG-113`). A drip fell along the dominant
# axis of gravity alone, so every run on a canvas was a straight, axis-parallel streak however the atlas
# lay against the ground. A parcel now also steps one across on a share of the lines it falls through,
# gravity's own `|minor| / |major|`, on the lines Bresenham would pick. Every texel of a line steps
# alike, so the drip still conserves every byte; gravity along a texture axis keeps the old drip to
# the byte.
#
# **`0.5.39`: a wetmap's stains have smooth edges on a plain `StandardMaterial`** (`AG-112`). A canvas's
# images were its texels, so close up every stain was a soft staircase. `WetCanvas::new_detailed` keeps
# the canvas and its digest and draws the two images up to `MAX_DETAIL` (4) times finer, redrawing the
# tiles that changed on each flush: the coverage read as a cubic B-spline, the edge drawn crisp at
# `DETAIL_EDGE`, the film's colour up to the rim. `docs/wetmap.gif` is drawn that way.
#
# **`0.5.38`: a cut face is wet with its own blood** (`AG-111`). A broken body's pieces showed their cut
# faces bare, and a fat band read as cheese. The flesh material in `FleshMode::Cap` now lays a film of
# blood over the tissue, full where the muscle is and a quarter of it over the fat at the rim, with its
# clear coat (`FleshParams::cut`, `with_cut_film`); the preset's pieces wear `CUT_FACE_FILM_MM`.
#
# **`0.5.37`: a broken body lies in its own blood** (`AG-110`). A body that burst left its floor as clean
# as it was. Every spawned piece's cut face is now a wound (`CutFaceBleed`) that pours onto the floor
# beside the piece each pulse (`CUT_FACE_POUR`), so the heap lies in a pool; a game that spawns its own
# pieces keeps the pours with `CutFaceBleed::of`.
#
# **`0.5.36`: a film's edge is a line** (`AG-109`). The flesh material read the wet map with one
# bilinear tap, so every blood rim was the canvas's texel staircase, soft and fringed. It is now read
# as a cubic B-spline in four taps and its rim drawn crisp at 4 % film depth: runs end in round drops.
# Shader only; no digest moves. WebGL2 re-checked.
#
# **`0.5.35`: a wound bleeds in runs** (`AG-108`). A hole pulsed one ellipse at its centre, and its blood
# ran from it as one column its own width. Every wound now pulses at `BLEED_WELLS` beads where its
# blood spills: a hole's on the downhill arc of its rim, a cut's on its lower lip (`SLASH_WELLS` was
# the cut's alone and is renamed). The skinned mannequin's skins are 256 texels a side.
#
# **`0.5.34`: a slash bleeds along its cut** (`AG-107`). A slash bled as a disc its own half-length in
# radius, so a cut on a thigh painted one sheet the leg's width from the cut to the foot. Its wound is
# now the cut it opened (`SLASH_OPEN_M` wide): a smear along it, and pulses that bead over the lower lip
# at `SLASH_WELLS` fixed places (`WoundSite::cut`, `CutLine`).
#
# **`0.5.33`: a laceration is a spindle** (`AG-106`). Every slash opened one width from end to end
# with square ends, onto a clean dry bed, and on a limb it read as a ribbon laid on the skin. The gape
# now closes to a point at both ends (`GAPE_TAPER`), the floor shallows with it, and the bed is wet with
# its own blood (`BED_BLOOD`, as vertex colour). `the_tear_is_frozen` is re-blessed, both halves.
#
# **`0.5.32`: the spray stops at what it reaches** (`AG-105`). Every surface took every droplet aimed
# at it. Each droplet now stains the nearest thing on its line, flies through a cloth's hole, and one a
# surface caught does not also land on the floor.
#
# **`0.5.31`: a blade cuts the shirt** (`AG-104`). A slash left the cloth over it whole. It now cuts a
# slit along the blade (`ClothHoles::slit`, `SLIT_WIDTH`), its direction read in the garment's own UVs.
#
# **`0.5.30`: a shot that goes through** (`AG-103`). Every impact stopped in the body: no exit wound,
# and nothing behind a victim was ever touched. `GoreHit::through()` opens an exit where the ray leaves
# the part, `EXIT_SCALE` wider, bleeding, and throws its forward spatter (`FORWARD_MIST` times its area)
# along the shot. A new surface, `Gore::wall()`, takes each droplet as its own physical stain, sized,
# stretched and pointed by how it struck; cloth behind the body is holed too.
#
# **`0.5.29`: a shirt** (`AG-102`). A shot at a clothed character wounded the skin under the cloth,
# unseen, and the cloth took a flat, hard-edged red patch that ran down it in a straight column. An
# impact now holes every cloth it crosses before the skin (`preset::ClothHoles`, cut from shadows and
# the depth prepass by a flesh prepass shader), and blood wicks into a weave along a frayed front
# (`WetCanvas::wick_uv`), thinner and matte, running only past `GoreDials::cloth_holds`. A floor is
# `FleshMode::Floor` now; `FleshMode::Cloth` keeps wet blood matte.
#
# **`0.5.28`: a body breaks where its skeleton is** (`AG-101`). A fracture is baked from a mesh asset,
# which is the bind pose, so a character caught mid-stride burst with its arms at its sides. Each piece
# is now carried by the bone of the vertex nearest it, to where that bone is when the body breaks, and
# the blow's place is read off the bind pose. A skinned body's fracture must be baked in the mesh's own
# space. Also `GoreHit::impact_at` and `at_surface`: a hit from a contact point and its normal.
#
# **`0.5.27`: `GoreScene::humanoid()` meets a real character** (`AG-100`). Run on a glTF character from
# the game this crate is developed in, it dressed 19 of 22 meshes as torso skin, belt, backpack and
# chest rig among them, and a shot at the chest wounded the rig. It now sorts a body, a wardrobe and
# gear by the words a character kit uses, and leaves what it does not know alone.
#
# **`0.5.26`: the fixed-step trap says so** (`AG-099`). Bevy's default `FixedUpdate` is 64 Hz and
# `GoreDials::hz` is 60, so a game that missed the first line of the checklist ran every bleed, bruise
# and drying 6.7 per cent fast and was told nothing. The preset now warns once, on its first tick, naming
# the rate it found. Nothing else changes.
#
# **`0.5.25`: memory is a number and a dial** (`AG-098`). A dressed skin owns three square canvases
# and costs 1.3 MiB at the shipped 128 (a character of six, 7.7 MiB), by the edge squared.
# `Gore::with_canvas` gives one surface its own edge, and `WetCanvas`, `FlayCanvas` and `DermisCanvas`
# report `heap_bytes` and `image_bytes`. `Gore` has a field more: build it with `Gore::skin`, `cloth`
# or `floor`. Nothing changes for a game that does not ask.
#
# **`0.5.24`: dress a loaded character with one component** (`AG-097`). `GoreScene` on the entity a glTF
# scene is spawned under dresses every mesh that appears below it, by the words in its node's name:
# `humanoid()` for the common names, `with` / `without` for yours, the last matching rule winning. A
# name is read as words, so `arm` is not `Armature`. The preset's own wound beds are never dressed.
#
# **`0.5.23`: a flat pool no longer clips to white** (`AG-096`). A wet film took a roughness of 0.25
# and a clear coat of 1.0 at its first texel of blood, and a flat pool in a directional light's mirror
# angle clipped to a white sticker. A film now smooths what it lies on in proportion to its depth, the
# wet roughness is 0.45 and the shipped coat `(0.3, 0.3)`. Shader and constants only; the digests of
# `capture_preset`, `capture_skinned` and `capture_flesh` are untouched. WebGL2 was not re-checked.
#
# **`0.5.22`: hit the character, not the mesh** (`AG-095`). `GoreHit::entity` may be any ancestor of
# dressed meshes: the preset casts the ray at every `Gore::skin` under it, as drawn, and hurts the
# nearest, ties going to the lower entity. A game's physics finds a capsule on a character, rarely the
# mesh that was struck, and Bevy's own `MeshRayCast` tests a skinned mesh's bind pose. A mesh with its
# own `Gore` is hurt directly, as before; the clips are byte-identical.
#
# **`0.5.21`: the preset obeys the player's violence setting** (`AG-094`). `GorePolicy` was a
# resource nothing in the crate read, so the two-line inclusion had no way to offer a gore setting.
# The preset now reads `tier` (at `Stylised` a hit is announced as `Wounded` and nothing is painted),
# `blood_decals`, `viscera` and `dismemberment`, at every hit and every drip. The default is the old
# behaviour: `capture_preset` is byte-identical, and so is a run at `BloodAndGore`.
#
# **`0.5.20`: a hit costs what the blood it lands on costs, not the world it lands in** (`AG-093`).
# The spray tests each droplet against a surface's bounding box before it casts at the surface, so
# twelve hits in one tick on a 97 000-triangle character fell from 19.4 ms to 3.1 ms and one hit among
# 240 dressed surfaces from 9.9 ms to 1.4 ms. Nothing that was skipped could have landed:
# `capture_preset` and `capture_skinned` are byte-identical.
#
# **`0.5.19`: a shot lands on the body as it is drawn** (`AG-092`). The preset casts hits, sprays and
# drips at a skinned mesh's pose instead of its bind pose, so a shot at a raised forearm opens the
# forearm. `bevy_carnage::skin` is new (`Pose`, `Rig`, `posed_mesh`, `posed_vertex`); `WoundSite`
# gains `skin: Option<SkinAnchor>`; a skinned part gets a `RunDirection` that follows the pose at its
# wounds. A rigid mesh takes the old path: `capture_preset` is byte-identical.
#
# **`0.5.18`: the preset measures the atlas** (`AG-091`). An unstated `Gore::uv_per_metre` (now
# `Option<f32>`) is measured from the mesh at its world scale when it is dressed, instead of `1.0`.
#
# **`0.5.17`: a broken body hands over its pieces** (`AG-090`). `GoreFractured` carries every
# `GorePiece` (meshes, world transform, half extents, launch velocity, `PieceFate`) and both
# materials, once per body, whether or not the preset spawns them.
#
# **`0.5.16`: every wound bleeds, from where it is** (`AG-089`). `Wounds` holds every open wound on
# a part, each found once as a UV and a mesh point; `WetCanvas::paint_world*` return the UV they
# painted. `GoreDials::open_wounds` is new.
#
# **`0.5.15`: a textured character keeps its skin** (`AG-088`). The flesh shader composites the
# flaymap over the authored skin instead of replacing its texture, and thrown pieces wear the hit
# part's material. `FleshTables::material` takes `Option<&FlayCanvas>`; `set_flay` is gone.
#
# **`0.5.14`: a slash cuts one character** (`AG-087`), not every instance sharing its mesh; and
# `docs/preset.md` (`AG-086`), the checklist for putting the preset on a real glTF character.
#
# **`0.5.13`: a wetmap costs what its blood covers** (`AG-085`). The passes run over the rectangle the
# blood is in, grown by the two texels a tick can move it, and a still canvas skips its tick;
# `WetCanvas::is_still` is new. Bit-identical: no digest moved.
#
# **`0.5.12`: blood runs down, and wounds bleed** (`AG-083`, `AG-084`). `Gore::with_gravity_uv` is new
# and `Gore::gravity_uv` documents which way Bevy's primitives run; the demos' wounds bleed and drip
# down rather than up.
#
# **`0.5.11` makes a cut through the body read as meat** (`AG-082`). Supplied faces flush against
# another hull are joints, not skin; a trunk's deep cut samples mid-muscle, not the cortex's texel; a
# strip carries four mip levels, not a full chain that blended the bands.
#
# **`0.5.10` gives a preset skin the tangents its wounds need** (`AG-081`). The crater normal map is
# tangent-space and Bevy drops it on a mesh without tangents, so `GorePlugin` now generates them for
# every `Gore::skin` mesh that lacks them, and waits for a still-loading mesh before dressing it.
#
# **`0.5.9` makes a flayed wound look like one** (`AG-080`). A flaymap texel holds the tissue averaged
# over its grain instead of one point of it, its band edges are torn by noise, and a new
# `FlayCanvas::normal` image slopes the crater's walls. Cut-face strips carry a mip chain, a thinner
# muscle net and retuned dermis and fat. `cross_section::texel_mean` is new and public.
#
# **`0.5.8` changes no line of the library.** The examples it ships were reworked by the visual pass
# (`AG-062` … `AG-077`): blows push their pieces along their own direction, a reset clears the blood in
# the air, one interior material for every cut face, and cameras and HUDs that frame what they show.
#
# **`0.5.7` is a patch for what the crate says.** Warnings that named the six crates folded into this
# one in 0.5.0 (`bevy_laceration: …`, `bevy_viscera: …`) name the module instead. No behaviour moved.
#
# **`0.5.6` is a patch for the floor stains.** A stain decal painted any surface within a metre above
# its plane, so a body standing in blood was streaked up the legs and chunks lying in a pool turned
# pink; it now paints within 4 cm. Nothing else moved.
#
# **`0.5.5` is a patch for the ribbons.** A gib's blood strand is a thumb-wide stream that holds its
# width over its first half, where it was a finger-wide thread tapering from the head; and the ribbon
# systems' commands no longer warn when the consumer despawns a chunk in the same frame.
#
# **`0.5.4` is a patch that fixes `0.5.3`.** Its new laceration clip removed every triangle a cut
# entered, so a slash across a low-poly face deleted the face. The new rules now apply only where every
# vertex is within the influence radius; a coarser mesh stays closed, as in `0.5.2`. Nothing else moved.
#
# **`0.5.3` is a patch: four things that looked wrong now look right.** A body with no footing comes
# down; spilled gut drapes instead of standing out as rods; the GPU spray is round blood-red drops
# rather than pink squares; and a slash opens as one trough instead of a dashed row of pits. One item
# is added (`viscera::Strand::curved`) and none removed. `bench_carnage`'s digest is unchanged.
#
# **`0.5.2` is a patch: the same output, a cheaper bake again.** Each cell's face planes are computed
# once rather than once per render triangle tested against it, which the bench measures at -17.7 % of
# the bake with its digest unchanged. With `0.5.1`, the bake is 25 % cheaper than `0.5.0`.
#
# **`0.5.1` is a patch: the same output, a cheaper bake.** The attribute weld resolves a corner it has
# already emitted with one lookup instead of the 27-cell probe, which the bench measures at -8.7 % of
# the bake with its digest unchanged. Lockfiles move to `bevy` 0.19.1; the manifest's requirements do not.
#
# **`0.5.0` folds the seven kernel crates in as modules.** `bevy_carnage::wetmap` and the rest are the
# same paths they were as re-exports, so a consumer that followed the README changes nothing; the
# manifest loses seven dependencies and gains none. The minor bump is for the one thing that does
# move: a consumer that named a leaf crate directly now names this one. `libm` is unconditional,
# because the blood model bakes with it whether or not `flesh` is on.
#
# **`0.4.0` adds the pixel half and the preset, and is additive on every type that existed.** `flesh`
# (default on) is `FleshMaterial` — an `ExtendedMaterial<StandardMaterial, _>` with an embedded WGSL,
# two CPU-baked tables frozen by a golden, and `libm` to bake them — and `preset` is `GorePlugin`,
# `Gore`, `GoreHit`: the whole family behind one dependency line, which the flagship now stands on.
# The minor bump is for the manifest: a new default feature, a new optional dependency, and the leaf
# requirements moving to `bloodstain 0.3` (bruise, burn and wick) and the three patch releases that
# carry the data channels the shader reads. Nothing that compiled against `0.3` stops compiling.
#
# **`0.3.1` is additive: `bevy_wetmap` and `bevy_viscera` become real dependencies and are re-exported**
# as `bevy_carnage::wetmap` and `bevy_carnage::viscera`, so every kernel this crate composes is behind
# one dependency line. `0.3.0` composed four of the six and left those two as dev-only.
#
# **`0.2.0` breaks the API deliberately, and the break is a de-duplication rather than a rename.** The
# whole blood model — the Comiskey spatter, the pools, the bleed schedule, `hash_f32` and `WoundKind` —
# moved out to `bloodstain`, which is engine-free and has no math library in its public API. This crate
# re-exports every moved name, so most callers see nothing; what does break is `Wounded` gaining a
# `class`, `Wound::to_world` taking one, the blood dials moving under `CarnageSettings::blood`, and the
# four baked splat variants being replaced by a stain silhouette derived from the impact.
#
# `0.1.1` was documentation only: `0.1.0`'s README was packaged before the publish-prep edits landed and
# told a reader on crates.io that the crate is "not on crates.io". A published version cannot be
# amended, so that correction shipped as a patch release. No code changed between those two.
version = "0.5.62"
edition = "2024"
description = "Deterministic runtime gore for Bevy: plane-cut a character's own meshes into watertight-capped chunks, bore bullet channels through them, and drive blood, spatter and impact feel off the wounds that result."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Ladvien/bevy_carnage"
keywords = ["bevy", "gamedev", "gore", "fracture", "destruction"]
categories = ["game-development", "graphics"]
# **The six `docs/*.gif` are 10.4 MB of the crate's 11.9 MB, and crates.io's package limit is 10 MiB.**
# GIFs do not gzip, so they cannot be squeezed under it — and a registry consumer wants the library, not
# the clips. Excluded here and served from the mirror instead; `README.md`'s image links are absolute for
# exactly this reason. `docs/DEMOS.md` stays in the package and its relative links resolve on the mirror,
# where it is actually read.
exclude = ["docs/*.gif"]

[dependencies]
# The umbrella with defaults off, matching `bevy_speech_bubbles`' precedent in the parent workspace.
# The bake reads whatever scene a subject loads and writes `Mesh` assets back, so it needs the asset
# arena, the mesh types, PBR's material handle for the detached part, the ECS/app to be a plugin at all,
# and `log` for the loud refusals that are this crate's answer to bad input.
bevy = { version = "0.19.0", default-features = false, features = [
    "bevy_asset",   # Assets<Mesh>, Handle<T>, AssetId<T>, AssetPath, RenderAssetUsages
    "bevy_mesh",    # Mesh, Mesh3d, Indices, PrimitiveTopology, VertexAttributeValues
    "bevy_pbr",     # StandardMaterial / MeshMaterial3d — the detached part keeps its own material
    "bevy_image",   # Image — the wetmap, flaymap and cross-section strip are CPU-authored images
    "bevy_render",  # render_resource::{Extent3d, TextureDimension, TextureFormat} for those images
    "bevy_camera",  # NoFrustumCulling, DynamicSkinnedMeshBounds — a wound bed is culled as its skin is
    # `WorldAsset` — the scene handle a subject is keyed by. It lives in
    # `bevy_world_serialization`, NOT `bevy_scene`, and naming the wrong one here still built for a
    # long time: `cargo test` pulls the dev-dependency full umbrella, which enables everything, so the
    # gap only appears in a build that does not. `cargo build --release -p bevy_carnage` is the check.
    "bevy_world_serialization",
    "bevy_scene",   # the scene types `bevy_world_serialization` is layered over
    "bevy_log",     # warn!/error!/info! — a refusal has to be visible
    "std",
] }
# The five bake dials deserialize, so a caller can author them in a data file rather than hardcoding
# fragment counts. Optional because a caller that builds `FractureSettings` in code needs none of it.
serde = { version = "1.0", features = ["derive"], optional = true }

# **The seven kernels are modules, not dependencies, since 0.5.0.** `bloodstain`, `bevy_wetmap`,
# `bevy_viscera`, `bevy_cross_section`, `bevy_flaymap`, `bevy_laceration` and `bevy_fracture_modes`
# were path-and-version dependencies here from 2026-09-02 to 2026-09-04; each is now `src/<name>/`
# under the module name it was always re-exported by. Seven registry entries were seven version
# pins to keep aligned for a family only ever meant to be reached through this crate. What the
# boundary bought is kept as a convention: `tests/leaf.rs::bloodstain_is_still_engine_free` holds
# the blood model to no `bevy`, no `glam`, no `std`, `[f32; 3]` in every signature, and the one
# conversion in `src/v3.rs`.

# **The mesh validator.** This crate could always cut a mesh; it could never say whether what came out
# was closed, manifold or consistently wound — `examples/fracture_cube.rs` says so in as many words.
# `isomesh` is what answers that, and it is an unusually cheap thing to admit: `no_std`, exactly one
# dependency of its own (`libm`), and **no math library in its public API** — every signature is
# `[f32; 3]`, so it cannot collide with the `glam` version Bevy 0.19 pins. That last property is why
# this is a dependency at all rather than a vendored copy.
#
# **Pinned exactly, and that is not caution — it is the same rule as `hash_f32`.** isomesh is under
# active development in a sibling repo. An unpinned dependency whose welder or validator moved between
# builds would move this crate's *reported* topology between builds, which is the same class of bug
# `seed_from_path` and the canonical soup order exist to prevent. Bump it deliberately, in a commit that
# re-blesses the locked topology counts, or not at all. For a `0.0.x` Cargo's caret range admits one
# version and nothing else, so `version = "0.0.10"` is as exact as the `rev` it replaced — and it is
# checksummed in `Cargo.lock`, which a git rev is not.
#
# **The registry release rather than a git rev, because this crate publishes.** crates.io rejects a
# package with a git dependency outright, so the rev could not survive the move. `0.0.10` went to
# crates.io on 2026-08-27 and is the version `aa82b0b` already declared; what `origin/main` carried
# beyond it — `isomesh::mass`, the divergence-theorem volume/inertia/`asymmetry` work — was never
# adopted here, so nothing this crate calls went with the rev. Revisit only to bump.
#
# **Bumped twice.**
#
# `4369e3c` → `22c3b35` (AG-013). Cost: one re-blessed number. `supports_inside_outside` gained a
# `non_manifold_vertices == 0` clause, so the torso+head baseline's collider-ready count went 4 → 1.
# That is a *correction*, not a regression — the old policy let a bowtie vertex through, and ten of
# those twelve fragments have one. Bought: `weld_split_by` (the composite-key weld AG-005 was scoped to
# hand-roll), and `predicates` with `orient2d`/`incircle`.
#
# `22c3b35` → `aa82b0b` (AG-021), 291 commits, `0.0.7` → `0.0.10` plus the unreleased `mass` work.
# **Cost: zero re-blessed numbers, and that is a measurement rather than a hope.** `weld.rs` and
# `mesh.rs` are byte-identical across the two revs. Every compute pass in `validate.rs` that produces a
# counter this crate reads is line-for-line identical — the face triage, the edge-run scan behind
# `boundary_edges`/`inconsistently_oriented_edges`/`non_manifold_edges`, the vertex-link pass behind
# `non_manifold_vertices`, the degenerate-area test, the duplicate-vertex lattice probe, and the derived
# χ/genus block. So are `ColliderReadiness`'s three predicates and `collider::from_report`.
# `ValidateConfig::WELD_EPSILON_REL` is still `1e-4`, so `CELL_SIZE` and every threshold derived from it
# are unmoved. `MeshReport`'s `Display` block is byte-identical, so even a printed report is the same
# text. The only change in `collider.rs` is `triangle_indices` switching to `as_chunks::<3>()` — same
# output. The one behaviour change 0.0.10 advertises loudly — vertex positions moving on the default
# extraction path, 135 of 216 golden hashes rebaselined — is unreachable from here: this crate never
# calls an extractor. Bought: `validate::sealing`, `validate::mesh_hash`, `connectivity`, `mass`, and two
# recorded-never-gated `MeshReport` fields; none adopted, each triaged in
# `docs/isomesh-upstream-asks.md`. Still `no_std` with `libm` as its only dependency — and that is
# checked in `Cargo.lock`, not by `tests/leaf.rs`, which only parses this manifest's text.
#
# **The registry release, not the rev, because crates.io forbids a git dependency.** `0.0.10` is the
# version the pinned `aa82b0b` already *declared* — the rev was "0.0.10 plus unreleased work" — and for
# a `0.0.x` Cargo's caret range admits that one version alone, so this is still an exact, checksummed
# pin. The extra work the rev carried (`validate::sealing`, `validate::mesh_hash`, `connectivity`,
# `mass`) was **never adopted**: the used surface is exactly
# `isomesh::validate::{check_determinism, validate_indexed}`, `isomesh::collider` and
# `isomesh::weld::Welder`, all of which the paragraph above measured byte-identical between `22c3b35`
# and `aa82b0b`. The frozen topology counts in this crate's tests are computed by that validator, so
# the swap is proven by `cargo test -p bevy_carnage --all-features`, not assumed.
isomesh = { version = "0.0.10", default-features = false }
# **Transcendental arithmetic for the flesh tables.** `src/flesh.rs` bakes two lookup textures on the
# CPU — Jensen's dipole integrated around Penner's ring, and the spectral blood film — and a golden
# freezes their bytes. `std`'s `exp`/`sin`/`acos` are whatever the platform's libm is, which is not
# promised bit-identical across machines; `libm` is one implementation everywhere, and it is already in
# the lockfile as `bloodstain`'s and `isomesh`'s one dependency. Only the `flesh` feature reads it.
libm = { version = "0.2" }

# **GPU blood, and it is optional for a reason the CI enforces.** `bevy_hanabi` compiles particle
# effects to compute shaders, which means it drags in `bevy_render` and the whole GPU stack — exactly
# what the trimmed `bevy` above exists to keep out of a consumer that only wants the bake. Behind the
# `vfx` feature the crate's default-off build is unchanged, and `cargo build --release
# --no-default-features --features serde` still resolves no render crate at all.
#
# **Admitted on the same terms as `isomesh`, and it passes them for a sharper reason: it cannot
# report.** Hanabi 0.19 has no GPU→CPU readback path whatsoever, so a particle's position is
# physically unable to reach a golden, a hash or a simulation. The determinism half of this crate
# cannot see it even by mistake — the library enforces the write-only rule that the contract states.
#
# Version matched deliberately: hanabi 0.19 targets bevy 0.19 (its README's compatibility table reads
# `| 0.19 | 0.19 |`), and both resolve the same `wgpu`/`naga` 29 that `bevy 0.19.1` pins in this
# lockfile — checked, not assumed, because a mismatched `wgpu` is the one conflict a vendored fork
# would be tempting for and a vendored Hanabi is worse than no GPU blood.
bevy_hanabi = { version = "0.19", default-features = false, features = ["3d"], optional = true }

# **Examples only.** The crate's own `bevy` above is trimmed to what a bake needs. A runnable example
# additionally needs a window, an event loop (winit) and the 3D render pipeline, so it takes the full
# umbrella here, where it cannot reach a consumer's dependency graph. `tests/leaf.rs` reads
# `[dependencies]` only, deliberately.
[dev-dependencies]
bevy = { version = "0.19.0" }
# **A RON parser, for one test and one reason.** `FractureSettings` is `deny_unknown_fields` with every
# field required, so adding a dial breaks every authored file that enumerated the others — at load time,
# which no compile catches. `a_config_written_before_ejecta_soften_still_loads` pins that against the
# real shape a consumer authors, and it cannot be written without a format. Free in practice: `ron` is
# already in the lockfile as a `bevy` dependency, and `tests/leaf.rs` scopes its closed-dependency
# ratchet to `[dependencies]` for exactly this kind of case.
ron = { version = "0.12" }

# **The wasm demos' extra features.** Target-gated, so a native build resolves none of it.
#
# `web` is REQUIRED and not optional polish: without it `std::time::Instant::now()` compiles for
# `wasm32-unknown-unknown` and then PANICS in the browser, because there is no such clock there.
# `webgpu` takes precedence over the `webgl2` that Bevy's defaults always pull in
# (`bevy_render-0.19.0/src/settings.rs` selects `Backends::BROWSER_WEBGPU` on wasm when both are on),
# so these modules are WebGPU-only and `web/play.html` gates on an adapter before importing them.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
bevy = { version = "0.19", default-features = false, features = ["web", "webgpu"] }

[features]
default = ["serde", "vfx", "flesh"]

# **The pixel half.** `FleshMaterial`, an `ExtendedMaterial<StandardMaterial, _>` with an embedded
# WGSL, its two CPU-baked tables and the `libm` that bakes them. On by default and **wasm-safe**: it
# is forward-path WGSL over the same canvases the CPU owns, so `scripts/build_web.sh` turns it on where
# it turns `vfx` off. `bevy/bevy_image` is the umbrella feature that exposes `bevy::image` for the
# table images; `bevy_pbr` already pulls the render crates underneath.
flesh = []

# **Forwarded, not duplicated.** The blood dials live in `bloodstain::BloodSettings` and are reached
# through `CarnageSettings::blood`, so a caller that authors this crate's settings in RON needs the
# leaf's derives too. One feature, one answer: there is no way to get a serialisable `CarnageSettings`
# with a non-serialisable blood block.
serde = ["dep:serde"]

# **The GPU half.** Particle effects and stain decals: everything that renders and nothing that
# decides. Gated so a headless harness can take the deterministic half alone — which is also what
# keeps `bevy_hanabi` and `bevy_render` out of the lean build the CI's `cargo build --release` step
# exists to defend.
#
# The `bevy/*` features are the ones the render path needs and that the trimmed base deliberately
# omits: `bevy_render` for the pipeline, `bevy_core_pipeline` for the depth prepass a forward decal
# requires, `bevy_image` for the procedurally generated splat texture, and `bevy_camera` for the
# camera types Hanabi's extraction reads.
vfx = [
    "dep:bevy_hanabi",
    "bevy/bevy_render",
    "bevy/bevy_core_pipeline",
    "bevy/bevy_image",
    "bevy/bevy_camera",
]

# **The vertex-soup sort's runtime tie check.** Off in a release build (it costs a pass over the parts
# list); on automatically under `debug_assertions`; and turned on explicitly by a test harness that
# builds in release but still wants the check on. See `bake::sort_total_by_key_at`.
strict-order = []

# **The six examples that ARE the `vfx` half, declared so cargo skips them without it.**
#
# `required-features` is cargo's own mechanism for exactly this: these six demonstrate particles,
# ribbons and stain decals, so with `vfx` off there is nothing for them to demonstrate and their
# imports do not resolve. Before this, `cargo check --examples --no-default-features --features serde`
# — which is the feature set `scripts/build_web.sh` builds the web demos under — failed on all six.
#
# **Not a shim, and the distinction matters:** the alternative would be `#[cfg(feature = "vfx")]`
# scattered through six example bodies, which is two versions of each demo. This says the true thing
# once, in the manifest, and the ten web demos below it build with `vfx` off because they were written
# to.

[[example]]
name = "carnage"
required-features = ["vfx"]

[[example]]
name = "capture_carnage"
required-features = ["vfx"]

[[example]]
name = "pooling"
required-features = ["vfx"]

[[example]]
name = "capture_pooling"
required-features = ["vfx"]

[[example]]
name = "ribbons"
required-features = ["vfx"]

[[example]]
name = "capture_ribbons"
required-features = ["vfx"]

# **The four that ARE the `flesh` half.** The flesh material and the preset live behind `flesh`, so
# these do not resolve without it — `required-features` is the same statement as the six above.

[[example]]
name = "capture_flesh"
required-features = ["flesh"]

[[example]]
name = "capture_preset"
required-features = ["flesh"]

[[example]]
name = "preset"
required-features = ["flesh"]

[[example]]
name = "carnage_web"
required-features = ["flesh"]

[[example]]
name = "flesh"
required-features = ["flesh"]

# **And the two that run the preset on a skinned, animated body** — `skinned` windowed and
# `capture_skinned` headless, both on `common/mannequin.rs`.

[[example]]
name = "capture_skinned"
required-features = ["flesh"]

[[example]]
name = "skinned"
required-features = ["flesh"]
