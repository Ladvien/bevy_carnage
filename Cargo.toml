[package]
name = "bevy_carnage"
# **`0.3.1` is additive: `bevy_wetmap` and `bevy_viscera` become real dependencies and are re-exported**
# as `bevy_carnage::wetmap` and `bevy_carnage::viscera`, so every kernel this crate composes is behind
# one dependency line. `0.3.0` composed four of the six and left those two as dev-only.
#
# **`0.2.0` breaks the API deliberately, and the break is a de-duplication rather than a rename.** The
# whole blood model — the Comiskey spatter, the pools, the bleed schedule, `hash_f32` and `WoundKind` —
# moved out to `bloodstain`, which is engine-free and has no math library in its public API. This crate
# re-exports every moved name, so most callers see nothing; what does break is `Wounded` gaining a
# `class`, `Wound::to_world` taking one, the blood dials moving under `CarnageSettings::blood`, and the
# four baked splat variants being replaced by a stain silhouette derived from the impact.
#
# `0.1.1` was documentation only: `0.1.0`'s README was packaged before the publish-prep edits landed and
# told a reader on crates.io that the crate is "not on crates.io". A published version cannot be
# amended, so that correction shipped as a patch release. No code changed between those two.
version = "0.3.1"
edition = "2024"
description = "Deterministic runtime gore for Bevy: plane-cut a character's own meshes into watertight-capped chunks, bore bullet channels through them, and drive blood, spatter and impact feel off the wounds that result."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Ladvien/bevy_carnage"
keywords = ["bevy", "gamedev", "gore", "fracture", "destruction"]
categories = ["game-development", "graphics"]
# **The six `docs/*.gif` are 10.4 MB of the crate's 11.9 MB, and crates.io's package limit is 10 MiB.**
# GIFs do not gzip, so they cannot be squeezed under it — and a registry consumer wants the library, not
# the clips. Excluded here and served from the mirror instead; `README.md`'s image links are absolute for
# exactly this reason. `docs/DEMOS.md` stays in the package and its relative links resolve on the mirror,
# where it is actually read.
exclude = ["docs/*.gif"]

[dependencies]
# The umbrella with defaults off, matching `bevy_speech_bubbles`' precedent in the parent workspace.
# The bake reads whatever scene a subject loads and writes `Mesh` assets back, so it needs the asset
# arena, the mesh types, PBR's material handle for the detached part, the ECS/app to be a plugin at all,
# and `log` for the loud refusals that are this crate's answer to bad input.
bevy = { version = "0.19.0", default-features = false, features = [
    "bevy_asset",   # Assets<Mesh>, Handle<T>, AssetId<T>, AssetPath, RenderAssetUsages
    "bevy_mesh",    # Mesh, Mesh3d, Indices, PrimitiveTopology, VertexAttributeValues
    "bevy_pbr",     # StandardMaterial / MeshMaterial3d — the detached part keeps its own material
    # `WorldAsset` — the scene handle a subject is keyed by. It lives in
    # `bevy_world_serialization`, NOT `bevy_scene`, and naming the wrong one here still built for a
    # long time: `cargo test` pulls the dev-dependency full umbrella, which enables everything, so the
    # gap only appears in a build that does not. `cargo build --release -p bevy_carnage` is the check.
    "bevy_world_serialization",
    "bevy_scene",   # the scene types `bevy_world_serialization` is layered over
    "bevy_log",     # warn!/error!/info! — a refusal has to be visible
    "std",
] }
# The five bake dials deserialize, so a caller can author them in a data file rather than hardcoding
# fragment counts. Optional because a caller that builds `FractureSettings` in code needs none of it.
serde = { version = "1.0", features = ["derive"], optional = true }

# **The blood model, carved out on 2026-09-02.** Everything about blood as a *material* — the
# Carreau-Yasuda rheology and its Casson yield stress, the Comiskey percolation spatter, the stain
# morphology, the six forensic pattern classes, the drying timeline, the pools, the bleed schedule,
# `hash_f32` and `WoundKind` — lives there, because none of it needs Bevy and all of it is reusable.
# This crate re-exports every moved name, so a caller's `use bevy_carnage::{Droplet, Stain, Pool}`
# still resolves.
#
# **Admitted on exactly `isomesh`'s terms, which is why the boundary stays meaningful:** `no_std`, two
# dependencies of its own (`libm` and an optional `serde`), and **no math library in its public API** —
# every signature is `[f32; 3]`. The workspace resolves two `glam` versions, so a leaf naming either
# could collide with a consumer naming the other; naming neither cannot. Conversion has one home,
# `src/v3.rs`, and it is per wound rather than per vertex.
#
# Path *and* version, because `cargo publish` refuses a path-only dependency.
bloodstain = { version = "0.2", path = "../bloodstain", default-features = false }

# **The 2026-09-04 four.** Each is a kernel this crate composes and none depends on it back; each
# is path *and* version because `cargo publish` refuses a path-only dependency.
#
# `bevy_cross_section` bands a cap by depth below the skin — `ProxyCell::skin_planes` is the
# measurement and `FragmentGeometry::annotate_cap` the write. `bevy_fracture_modes` is Sellán's
# modes over the bond graph; `src/modal.rs` is the two conversions. `bevy_flaymap` peels a body in
# texture space and hands the bone to a `radial` reach; `bevy_laceration` opens a cut over time.
# All four are re-exported whole, so a consumer needs one dependency line.
bevy_cross_section = { version = "0.1", path = "../bevy_cross_section", default-features = false }
bevy_fracture_modes = { version = "0.1", path = "../bevy_fracture_modes", default-features = false }
bevy_flaymap = { version = "0.1", path = "../bevy_flaymap", default-features = false }
bevy_laceration = { version = "0.1", path = "../bevy_laceration", default-features = false }
# **The two blood-and-guts siblings, promoted in 0.3.1.** Until then they were dev-dependencies —
# reachable by this crate's demos, invisible to a consumer — which made "one dependency line" true
# of four kernels and false of two. A game that wanted the wetmap had to name it beside this crate
# and could end up with two versions of `bloodstain`. Both are `no_std`-light, depend only on
# `bevy` and `bloodstain`, and neither depends on this crate back (their `tests/leaf.rs` forbid it).
bevy_wetmap = { version = "0.2", path = "../bevy_wetmap", default-features = false }
bevy_viscera = { version = "0.1", path = "../bevy_viscera", default-features = false }
# **The mesh validator.** This crate could always cut a mesh; it could never say whether what came out
# was closed, manifold or consistently wound — `examples/fracture_cube.rs` says so in as many words.
# `isomesh` is what answers that, and it is an unusually cheap thing to admit: `no_std`, exactly one
# dependency of its own (`libm`), and **no math library in its public API** — every signature is
# `[f32; 3]`, so it cannot collide with the `glam` version Bevy 0.19 pins. That last property is why
# this is a dependency at all rather than a vendored copy.
#
# **Pinned exactly, and that is not caution — it is the same rule as `hash_f32`.** isomesh is under
# active development in a sibling repo. An unpinned dependency whose welder or validator moved between
# builds would move this crate's *reported* topology between builds, which is the same class of bug
# `seed_from_path` and the canonical soup order exist to prevent. Bump it deliberately, in a commit that
# re-blesses the locked topology counts, or not at all. For a `0.0.x` Cargo's caret range admits one
# version and nothing else, so `version = "0.0.10"` is as exact as the `rev` it replaced — and it is
# checksummed in `Cargo.lock`, which a git rev is not.
#
# **The registry release rather than a git rev, because this crate publishes.** crates.io rejects a
# package with a git dependency outright, so the rev could not survive the move. `0.0.10` went to
# crates.io on 2026-08-27 and is the version `aa82b0b` already declared; what `origin/main` carried
# beyond it — `isomesh::mass`, the divergence-theorem volume/inertia/`asymmetry` work — was never
# adopted here, so nothing this crate calls went with the rev. Revisit only to bump.
#
# **Bumped twice.**
#
# `4369e3c` → `22c3b35` (AG-013). Cost: one re-blessed number. `supports_inside_outside` gained a
# `non_manifold_vertices == 0` clause, so the torso+head baseline's collider-ready count went 4 → 1.
# That is a *correction*, not a regression — the old policy let a bowtie vertex through, and ten of
# those twelve fragments have one. Bought: `weld_split_by` (the composite-key weld AG-005 was scoped to
# hand-roll), and `predicates` with `orient2d`/`incircle`.
#
# `22c3b35` → `aa82b0b` (AG-021), 291 commits, `0.0.7` → `0.0.10` plus the unreleased `mass` work.
# **Cost: zero re-blessed numbers, and that is a measurement rather than a hope.** `weld.rs` and
# `mesh.rs` are byte-identical across the two revs. Every compute pass in `validate.rs` that produces a
# counter this crate reads is line-for-line identical — the face triage, the edge-run scan behind
# `boundary_edges`/`inconsistently_oriented_edges`/`non_manifold_edges`, the vertex-link pass behind
# `non_manifold_vertices`, the degenerate-area test, the duplicate-vertex lattice probe, and the derived
# χ/genus block. So are `ColliderReadiness`'s three predicates and `collider::from_report`.
# `ValidateConfig::WELD_EPSILON_REL` is still `1e-4`, so `CELL_SIZE` and every threshold derived from it
# are unmoved. `MeshReport`'s `Display` block is byte-identical, so even a printed report is the same
# text. The only change in `collider.rs` is `triangle_indices` switching to `as_chunks::<3>()` — same
# output. The one behaviour change 0.0.10 advertises loudly — vertex positions moving on the default
# extraction path, 135 of 216 golden hashes rebaselined — is unreachable from here: this crate never
# calls an extractor. Bought: `validate::sealing`, `validate::mesh_hash`, `connectivity`, `mass`, and two
# recorded-never-gated `MeshReport` fields; none adopted, each triaged in
# `docs/isomesh-upstream-asks.md`. Still `no_std` with `libm` as its only dependency — and that is
# checked in `Cargo.lock`, not by `tests/leaf.rs`, which only parses this manifest's text.
#
# **The registry release, not the rev, because crates.io forbids a git dependency.** `0.0.10` is the
# version the pinned `aa82b0b` already *declared* — the rev was "0.0.10 plus unreleased work" — and for
# a `0.0.x` Cargo's caret range admits that one version alone, so this is still an exact, checksummed
# pin. The extra work the rev carried (`validate::sealing`, `validate::mesh_hash`, `connectivity`,
# `mass`) was **never adopted**: the used surface is exactly
# `isomesh::validate::{check_determinism, validate_indexed}`, `isomesh::collider` and
# `isomesh::weld::Welder`, all of which the paragraph above measured byte-identical between `22c3b35`
# and `aa82b0b`. The frozen topology counts in this crate's tests are computed by that validator, so
# the swap is proven by `cargo test -p bevy_carnage --all-features`, not assumed.
isomesh = { version = "0.0.10", default-features = false }

# **GPU blood, and it is optional for a reason the CI enforces.** `bevy_hanabi` compiles particle
# effects to compute shaders, which means it drags in `bevy_render` and the whole GPU stack — exactly
# what the trimmed `bevy` above exists to keep out of a consumer that only wants the bake. Behind the
# `vfx` feature the crate's default-off build is unchanged, and `cargo build --release
# --no-default-features --features serde` still resolves no render crate at all.
#
# **Admitted on the same terms as `isomesh`, and it passes them for a sharper reason: it cannot
# report.** Hanabi 0.19 has no GPU→CPU readback path whatsoever, so a particle's position is
# physically unable to reach a golden, a hash or a simulation. The determinism half of this crate
# cannot see it even by mistake — the library enforces the write-only rule that the contract states.
#
# Version matched deliberately: hanabi 0.19 targets bevy 0.19 (its README's compatibility table reads
# `| 0.19 | 0.19 |`), and both resolve the same `wgpu`/`naga` 29 that `bevy 0.19.1` pins in this
# lockfile — checked, not assumed, because a mismatched `wgpu` is the one conflict a vendored fork
# would be tempting for and a vendored Hanabi is worse than no GPU blood.
bevy_hanabi = { version = "0.19", default-features = false, features = ["3d"], optional = true }

# **Examples only.** The crate's own `bevy` above is trimmed to what a bake needs. A runnable example
# additionally needs a window, an event loop (winit) and the 3D render pipeline, so it takes the full
# umbrella here, where it cannot reach a consumer's dependency graph. `tests/leaf.rs` reads
# `[dependencies]` only, deliberately.
[dev-dependencies]
bevy = { version = "0.19.0" }
# **A RON parser, for one test and one reason.** `FractureSettings` is `deny_unknown_fields` with every
# field required, so adding a dial breaks every authored file that enumerated the others — at load time,
# which no compile catches. `a_config_written_before_ejecta_soften_still_loads` pins that against the
# real shape a consumer authors, and it cannot be written without a format. Free in practice: `ron` is
# already in the lockfile as a `bevy` dependency, and `tests/leaf.rs` scopes its closed-dependency
# ratchet to `[dependencies]` for exactly this kind of case.
ron = { version = "0.12" }

# **The wasm demos' extra features.** Target-gated, so a native build resolves none of it.
#
# `web` is REQUIRED and not optional polish: without it `std::time::Instant::now()` compiles for
# `wasm32-unknown-unknown` and then PANICS in the browser, because there is no such clock there.
# `webgpu` takes precedence over the `webgl2` that Bevy's defaults always pull in
# (`bevy_render-0.19.0/src/settings.rs` selects `Backends::BROWSER_WEBGPU` on wasm when both are on),
# so these modules are WebGPU-only and `web/play.html` gates on an adapter before importing them.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
bevy = { version = "0.19", default-features = false, features = ["web", "webgpu"] }

[features]
default = ["serde", "vfx"]

# **Forwarded, not duplicated.** The blood dials live in `bloodstain::BloodSettings` and are reached
# through `CarnageSettings::blood`, so a caller that authors this crate's settings in RON needs the
# leaf's derives too. One feature, one answer: there is no way to get a serialisable `CarnageSettings`
# with a non-serialisable blood block.
serde = [
    "dep:serde",
    "bloodstain/serde",
    "bevy_cross_section/serde",
    "bevy_fracture_modes/serde",
    "bevy_flaymap/serde",
    "bevy_laceration/serde",
]

# **The GPU half.** Particle effects and stain decals: everything that renders and nothing that
# decides. Gated so a headless harness can take the deterministic half alone — which is also what
# keeps `bevy_hanabi` and `bevy_render` out of the lean build the CI's `cargo build --release` step
# exists to defend.
#
# The `bevy/*` features are the ones the render path needs and that the trimmed base deliberately
# omits: `bevy_render` for the pipeline, `bevy_core_pipeline` for the depth prepass a forward decal
# requires, `bevy_image` for the procedurally generated splat texture, and `bevy_camera` for the
# camera types Hanabi's extraction reads.
vfx = [
    "dep:bevy_hanabi",
    "bevy/bevy_render",
    "bevy/bevy_core_pipeline",
    "bevy/bevy_image",
    "bevy/bevy_camera",
]

# **The vertex-soup sort's runtime tie check.** Off in a release build (it costs a pass over the parts
# list); on automatically under `debug_assertions`; and turned on explicitly by a test harness that
# builds in release but still wants the check on. See `bake::sort_total_by_key_at`.
strict-order = []

# **The six examples that ARE the `vfx` half, declared so cargo skips them without it.**
#
# `required-features` is cargo's own mechanism for exactly this: these six demonstrate particles,
# ribbons and stain decals, so with `vfx` off there is nothing for them to demonstrate and their
# imports do not resolve. Before this, `cargo check --examples --no-default-features --features serde`
# — which is the feature set `scripts/build_web.sh` builds the web demos under — failed on all six.
#
# **Not a shim, and the distinction matters:** the alternative would be `#[cfg(feature = "vfx")]`
# scattered through six example bodies, which is two versions of each demo. This says the true thing
# once, in the manifest, and the ten web demos below it build with `vfx` off because they were written
# to.

[[example]]
name = "carnage"
required-features = ["vfx"]

[[example]]
name = "capture_carnage"
required-features = ["vfx"]

[[example]]
name = "pooling"
required-features = ["vfx"]

[[example]]
name = "capture_pooling"
required-features = ["vfx"]

[[example]]
name = "ribbons"
required-features = ["vfx"]

[[example]]
name = "capture_ribbons"
required-features = ["vfx"]
